name: Pulse Digest

on:
  schedule:
    # 7:00 AM Santo Domingo (UTC-4) = 11:00 UTC — daily
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GLM_MODEL: glm-5.2
      GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pulse_hub/requirements.txt

      - name: Restore seen-article memory
        uses: actions/cache@v4
        with:
          path: pulse_hub/data
          key: senal-seen-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            senal-seen-${{ runner.os }}-

      - name: Validate configuration
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python pulse_hub/digest.py --health-check

      - name: Run digest
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python pulse_hub/digest.py
